name: Build PS4 Homebrew Binary

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl ca-certificates xz-utils unzip

      - name: Install OpenOrbis PS4 Toolchain
        run: |
          git clone --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git /tmp/orbis-toolchain
          cd /tmp/orbis-toolchain

          echo "Toolchain files:"
          ls -la

          if [ -f ./setup.sh ]; then
            chmod +x ./setup.sh
            ./setup.sh || true
          elif [ -f ./scripts/setup.sh ]; then
            chmod +x ./scripts/setup.sh
            ./scripts/setup.sh || true
          else
            echo "setup.sh not found in expected locations; continuing without it"
          fi

          echo "/tmp/orbis-toolchain/bin" >> "$GITHUB_PATH"
          echo "/tmp/orbis-toolchain/usr/bin" >> "$GITHUB_PATH"
          echo "ORBIS_TOOLCHAIN=/tmp/orbis-toolchain" >> "$GITHUB_ENV"

      - name: Compile PS4 Source Code
        run: |
          sed -i 's/\r$//' Makefile || true
          sed -i 's/\r$//' main.cpp || true

          command -v orbis-clang++ || command -v orbis-clang || true
          make

      - name: Upload Finished PS4 Binary
        uses: actions/upload-artifact@v4
        with:
          name: PS4-Executable-Binaries
          path: |
            ./*.bin
            ./*.elf
