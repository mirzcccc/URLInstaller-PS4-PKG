name: Build PS4 Homebrew Binary

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake wget tar clang lld llvm make

      - name: Setup OpenOrbis PS4 Toolchain
        uses: openorbis/setup-toolchain@v1
        with:
          version: '0.5.2'

      - name: Compile PS4 Source Code
        run: |
          # Automatsko čišćenje potencijalnih Windows simbola iz fajlova
          sed -i 's/\r$//' Makefile || true
          sed -i 's/\r$//' main.cpp || true
          
          # Pokretanje kompajliranja
          make

      - name: Upload Finished PS4 Binary
        uses: actions/upload-artifact@v4
        with:
          name: PS4-Executable-Binaries
          path: |
            ./*.bin
            ./*.elf
