name: Build PS4 Homebrew PKG

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET Runtime (Required for OpenOrbis Tools)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Compilers and Toolchain Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake wget tar clang lld llvm make

      - name: Download and Install OpenOrbis Toolchain
        run: |
          # Preuzimanje zvaničnog Linux izdanja OpenOrbis SDK-a
          wget https://github.com
          sudo mkdir -p /opt/OpenOrbis
          sudo tar -xzf OpenOrbis-PS4-Toolchain-v0.5.2.tar.gz -C /opt/OpenOrbis
          
          # Davanje izvršnih dozvola svim binarnim fajlovima unutar toolchain-a
          sudo chmod +x /opt/OpenOrbis/PS4Toolchain/bin/*
          
          # Postavljanje varijabli u GitHub okruženje
          echo "OO_PS4_TOOLCHAIN=/opt/OpenOrbis/PS4Toolchain" >> $GITHUB_ENV
          echo "/opt/OpenOrbis/PS4Toolchain/bin" >> $GITHUB_PATH

      - name: Build PS4 Homebrew PKG
        run: |
          export OO_PS4_TOOLCHAIN=/opt/OpenOrbis/PS4Toolchain
          export PATH=$OO_PS4_TOOLCHAIN/bin:$PATH
          
          # Pokretanje kompajliranja
          make

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS4-Homebrew-PKG
          path: ./*.pkg
