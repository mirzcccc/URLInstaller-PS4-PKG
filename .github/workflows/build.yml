name: Build PS4 Homebrew Binary

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm make

      - name: Compile PS4 Source Code
        run: |
          # Uklanjanje nevidljivih Windows znakova
          sed -i 's/\r$//' Makefile || true
          sed -i 's/\r$//' main.cpp || true
          
          # Pokretanje kompajliranja
          make

      - name: Upload Finished PS4 Binary
        uses: actions/upload-artifact@v4
        with:
          name: PS4-Executable-Binaries
          path: |
            ./*.bin
            ./*.elf
