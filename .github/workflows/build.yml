name: Build PS4 Homebrew PKG

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install OpenOrbis Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake wget tar clang llvm
          # Preuzimanje i instalacija najnovijeg OpenOrbis SDK-a sa zvaničnog repozitorija
          wget https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.2/OpenOrbis-PS4-Toolchain-v0.5.2.tar.gz
          sudo tar -xzf OpenOrbis-PS4-Toolchain-v0.5.2.tar.gz -C /opt
          echo "OO_PS4_TOOLCHAIN=/opt/OpenOrbis/PS4Toolchain" >> $GITHUB_ENV
          echo "/opt/OpenOrbis/PS4Toolchain/bin" >> $GITHUB_PATH

      - name: Build PS4 Homebrew PKG
        run: |
          # Postavljanje varijable okruženja za trenutni korak u slučaju da se PATH još nije osvježio
          export OO_PS4_TOOLCHAIN=/opt/OpenOrbis/PS4Toolchain
          export PATH=$OO_PS4_TOOLCHAIN/bin:$PATH
          
          # Pokretanje kompajliranja iz korijenskog direktorija (slash /)
          make

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS4-Homebrew-PKG
          path: ./*.pkg
