name: Build PS4 Homebrew Binary

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl ca-certificates xz-utils unzip python3

      - name: Install OpenOrbis PS4 Toolchain
        shell: bash
        run: |
          set -euxo pipefail

          TOOLCHAIN_ROOT="/tmp/orbis-toolchain"
          rm -rf "$TOOLCHAIN_ROOT"

          git clone --single-branch https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git "$TOOLCHAIN_ROOT"

          echo "Checking toolchain repo layout..."
          find "$TOOLCHAIN_ROOT" -maxdepth 4 -type d | head -200 || true

          mapfile -t toolchain_dirs < <(
            find "$TOOLCHAIN_ROOT" -type f \( \
              -name 'orbis-clang++' -o \
              -name 'orbis-objcopy' -o \
              -name 'orbis-pub-gen' \
            \) -printf '%h\n' | sort -u
          )

          if [ "${#toolchain_dirs[@]}" -eq 0 ]; then
            echo "No prebuilt OpenOrbis toolchain binaries were found; attempting to build the toolchain."

            if [ -f "$TOOLCHAIN_ROOT/build.sh" ]; then
              (cd "$TOOLCHAIN_ROOT" && ./build.sh)
            elif [ -f "$TOOLCHAIN_ROOT/build-toolchain.sh" ]; then
              (cd "$TOOLCHAIN_ROOT" && ./build-toolchain.sh)
            elif [ -f "$TOOLCHAIN_ROOT/Makefile" ]; then
              (cd "$TOOLCHAIN_ROOT" && make -j"$(nproc)")
            else
              echo "ERROR: No supported build script found in OpenOrbis toolchain repository."
              echo "Repository contents:"
              find "$TOOLCHAIN_ROOT" -maxdepth 5 -type f | head -200 || true
              exit 1
            fi

            mapfile -t toolchain_dirs < <(
              find "$TOOLCHAIN_ROOT" -type f \( \
                -name 'orbis-clang++' -o \
                -name 'orbis-objcopy' -o \
                -name 'orbis-pub-gen' \
              \) -printf '%h\n' | sort -u
            )
          fi

          if [ "${#toolchain_dirs[@]}" -eq 0 ]; then
            echo "ERROR: OpenOrbis toolchain binaries were not found."
            echo "Repository contents:"
            find "$TOOLCHAIN_ROOT" -maxdepth 5 -type f | head -200 || true
            exit 1
          fi

          echo "Found toolchain binary directories:"
          printf '%s\n' "${toolchain_dirs[@]}"

          for dir in "${toolchain_dirs[@]}"; do
            echo "$dir" >> "$GITHUB_PATH"
          done

          export PATH
          PATH="$(printf '%s:' "${toolchain_dirs[@]}")$PATH"
          export PATH

          echo "PATH updated with:"
          printf '%s\n' "${toolchain_dirs[@]}"

          command -v orbis-clang++ || { echo "orbis-clang++ not found in PATH"; exit 1; }
          command -v orbis-objcopy || { echo "orbis-objcopy not found in PATH"; exit 1; }

      - name: Build PS4 ELF and BIN
        shell: bash
        run: |
          set -euxo pipefail

          if ! command -v orbis-clang++ >/dev/null 2>&1; then
            mapfile -t toolchain_dirs < <(
              find /tmp/orbis-toolchain -type f \( \
                -name 'orbis-clang++' -o \
                -name 'orbis-objcopy' \
              \) -printf '%h\n' | sort -u
            )
            if [ "${#toolchain_dirs[@]}" -eq 0 ]; then
              echo "ERROR: Could not locate toolchain after clone."
              exit 1
            fi
            export PATH="$(printf '%s:' "${toolchain_dirs[@]}")$PATH"
          fi

          echo "Using toolchain from:"
          command -v orbis-clang++
          command -v orbis-objcopy

          sed -i 's/\r$//' Makefile || true
          sed -i 's/\r$//' main.cpp || true

          make clean || true
          make

      - name: Generate PS4 package if packaging tool is available
        shell: bash
        run: |
          set -euxo pipefail

          if ! command -v orbis-pub-gen >/dev/null 2>&1; then
            echo "orbis-pub-gen not found in PATH."
            echo "This repo can still build the PS4 .bin/.elf, but a valid PS4 .pkg requires the package tool and signing key."
            exit 0
          fi

          if [ -f "config.gp4" ]; then
            echo "Found orbis-pub-gen, generating PKG..."
            orbis-pub-gen config.gp4
          else
            echo "config.gp4 not found; skipping pkg generation."
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PS4-build-artifacts
          path: |
            ./*.bin
            ./*.elf
            ./*.pkg
