name: Build PS4 Homebrew PKG

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET Runtime (Required for OpenOrbis Tools)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Install Tools and Compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake wget tar clang lld llvm make

      - name: Download and Install OpenOrbis Toolchain
        run: |
          wget https://github.com
          sudo mkdir -p /opt/OpenOrbis
          sudo tar -xzf OpenOrbis-PS4-Toolchain-v0.5.2.tar.gz -C /opt/OpenOrbis
          sudo chmod -R +x /opt/OpenOrbis/PS4Toolchain/bin/
          
          # Definisanje okruženja za rad
          echo "OO_PS4_TOOLCHAIN=/opt/OpenOrbis/PS4Toolchain" >> $GITHUB_ENV
          echo "/opt/OpenOrbis/PS4Toolchain/bin" >> $GITHUB_PATH

      - name: Compile and Package PS4 Homebrew
        run: |
          export OO_PS4_TOOLCHAIN=/opt/OpenOrbis/PS4Toolchain
          export PATH=$OO_PS4_TOOLCHAIN/bin:$PATH
          
          # Prilagođavanje Makefile-a za Linux ako ima Windows kosa crte (\)
          sed -i 's/\\/\//g' Makefile || true
          
          # Pokretanje kompajliranja
          make

      - name: Upload Finished PKG
        uses: actions/upload-artifact@v4
        with:
          name: PS4-Project-Artifacts
          path: ./*.pkg
