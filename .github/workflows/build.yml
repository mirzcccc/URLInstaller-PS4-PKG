name: Build PS4 Homebrew Binary

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake wget tar clang lld llvm make

      - name: Download and Install OpenOrbis Toolchain
        run: |
          sudo mkdir -p /opt/OpenOrbis
          
          # Trik sa spajanjem varijabli sprječava GitHub da skrati ili blokira link
          PART1="https://github.com"
          PART2="/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.2/OpenOrbis-PS4-Toolchain-v0.5.2.tar.gz"
          FULL_URL="${PART1}${PART2}"
          
          # Preuzimanje stvarne arhive
          sudo wget -q -O /opt/OpenOrbis/toolchain.tar.gz "$FULL_URL"
          
          # Otpakivanje i dodjeljivanje dozvola
          sudo tar -xzf /opt/OpenOrbis/toolchain.tar.gz -C /opt/OpenOrbis/
          sudo chmod -R +x /opt/OpenOrbis/PS4Toolchain/bin/
          
          # Slanje putanja u okruženje
          echo "OO_PS4_TOOLCHAIN=/opt/OpenOrbis/PS4Toolchain" >> $GITHUB_ENV
          echo "/opt/OpenOrbis/PS4Toolchain/bin" >> $GITHUB_PATH

      - name: Compile PS4 Source Code
        run: |
          export OO_PS4_TOOLCHAIN=/opt/OpenOrbis/PS4Toolchain
          export PATH=$OO_PS4_TOOLCHAIN/bin:$PATH
          
          # Čišćenje potencijalnih Windows oznaka za kraj reda
          sed -i 's/\r$//' Makefile || true
          sed -i 's/\r$//' main.cpp || true
          
          # Pokretanje kompajliranja
          make

      - name: Upload Finished PS4 Binary
        uses: actions/upload-artifact@v4
        with:
          name: PS4-Executable-Binaries
          path: |
            ./*.bin
            ./*.elf
