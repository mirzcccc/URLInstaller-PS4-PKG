name: Build PS4 Homebrew Binary

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Compilers and Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake wget tar clang lld llvm make

      - name: Download and Install OpenOrbis Toolchain
        run: |
          # Pravljenje sigurnog foldera za instalaciju
          sudo mkdir -p /opt/OpenOrbis
          
          # Preuzimanje sa ISPRAVNIM i PUNIM linkom
          wget -q https://github.com
          
          # Otpakivanje direktno u direktorij
          sudo tar -xzf OpenOrbis-PS4-Toolchain-v0.5.2.tar.gz -C /opt/OpenOrbis
          
          # Dodjeljivanje dozvola za pokretanje na Linuxu
          sudo chmod -R +x /opt/OpenOrbis/PS4Toolchain/bin/
          
          # Postavljanje putanja u GitHub okruženje
          echo "OO_PS4_TOOLCHAIN=/opt/OpenOrbis/PS4Toolchain" >> $GITHUB_ENV
          echo "/opt/OpenOrbis/PS4Toolchain/bin" >> $GITHUB_PATH

      - name: Compile PS4 Source Code
        run: |
          export OO_PS4_TOOLCHAIN=/opt/OpenOrbis/PS4Toolchain
          export PATH=$OO_PS4_TOOLCHAIN/bin:$PATH
          
          # Pokretanje kompajliranja preko popravljenog alata
          make

      - name: Upload Finished PS4 Binary
        uses: actions/upload-artifact@v4
        with:
          name: PS4-Executable-Binaries
          path: |
            ./*.bin
            ./*.elf
