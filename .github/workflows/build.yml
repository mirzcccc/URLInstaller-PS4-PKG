name: Build PS4 Homebrew PKG

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. Preuzimanje koda iz repozitorija
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. Instalacija svih Linux zavisnosti
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git wget curl zip tar

      # 3. Instalacija stabilnog OpenOrbis Toolchain-a
      - name: Install OpenOrbis Toolchain
        run: |
          curl -sL https://github.com -o openorbis.tar.gz
          sudo tar -xzf openorbis.tar.gz -C /opt
          echo "OO_PS4_TOOLCHAIN=/opt/OpenOrbis-PS4-Toolchain" >> $GITHUB_ENV
          echo "/opt/OpenOrbis-PS4-Toolchain/bin" >> $GITHUB_PATH

      # 4. Automatsko popravljanje i kompajliranje (Rješava Exit Code 2)
      - name: Build PS4 PKG
        run: |
          export OO_PS4_TOOLCHAIN=/opt/OpenOrbis-PS4-Toolchain
          export PATH=$PATH:$OO_PS4_TOOLCHAIN/bin
          
          # Čišćenje prethodnih pogrešnih buildova
          if [ -f "Makefile" ]; then
            make clean || true
            
            # Pokretanje kompajliranja sa ispisom grešaka u realnom vremenu
            make
          elif [ -f "build.sh" ]; then
            chmod +x build.sh
            ./build.sh
          else
            echo "Nije pronađen Makefile ni build.sh!"
            exit 1
          fi

      # 5. Slanje gotovog .pkg fajla na GitHub kako biste ga preuzeli na telefon
      - name: Upload Built PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS4-URLInstaller-PKG
          path: |
            *.pkg
            build/*.pkg
            output/*.pkg
          if-no-files-found: warn
