name: Build PS4 Homebrew Binary

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl ca-certificates xz-utils unzip

      - name: Install OpenOrbis PS4 Toolchain
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf /tmp/orbis-toolchain
          git clone --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git /tmp/orbis-toolchain

          # The upstream toolchain repo does not provide setup.sh in the expected locations.
          # Add the toolchain bin directories directly to PATH.
          echo "/tmp/orbis-toolchain/bin" >> "$GITHUB_PATH"
          echo "/tmp/orbis-toolchain/usr/bin" >> "$GITHUB_PATH"

          if ! command -v orbis-clang++ >/dev/null 2>&1; then
            echo "ERROR: orbis-clang++ was not installed to PATH"
            find /tmp/orbis-toolchain -type f \( -name 'orbis-clang*' -o -name 'orbis-objcopy' \) | head -200
            exit 1
          fi

      - name: Compile PS4 Source Code
        shell: bash
        run: |
          set -euxo pipefail

          sed -i 's/\r$//' Makefile || true
          sed -i 's/\r$//' main.cpp || true

          command -v orbis-clang++
          make

      - name: Upload Finished PS4 Binary
        uses: actions/upload-artifact@v4
        with:
          name: PS4-Executable-Binaries
          path: |
            ./*.bin
            ./*.elf
