name: Build PS4 Homebrew Binary

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TOOLCHAIN_ROOT: /tmp/orbis-toolchain
      OPENORBIS_REPO: https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl ca-certificates xz-utils unzip python3 jq

      - name: Cache OpenOrbis toolchain
        if: always()
        uses: actions/cache@v4
        with:
          path: ${{ env.TOOLCHAIN_ROOT }}
          key: orbis-toolchain-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            orbis-toolchain-${{ runner.os }}-

      - name: Install OpenOrbis PS4 Toolchain
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$TOOLCHAIN_ROOT"
          mkdir -p "$TOOLCHAIN_ROOT"

          echo "Cloning OpenOrbis toolchain repository..."
          git clone --depth=1 --recursive "$OPENORBIS_REPO" "$TOOLCHAIN_ROOT"

          echo "Checking toolchain repo layout..."
          find "$TOOLCHAIN_ROOT" -maxdepth 5 -type d | head -200 || true

          TOOLCHAIN_BUILD_SCRIPT=""
          CANDIDATE_SCRIPTS=(
            "$TOOLCHAIN_ROOT/build.sh"
            "$TOOLCHAIN_ROOT/build/build.sh"
            "$TOOLCHAIN_ROOT/build-toolchain.sh"
            "$TOOLCHAIN_ROOT/build/build-toolchain.sh"
          )

          for candidate in "${CANDIDATE_SCRIPTS[@]}"; do
            if [ -f "$candidate" ]; then
              TOOLCHAIN_BUILD_SCRIPT="$candidate"
              break
            fi
          done

          if [ -n "$TOOLCHAIN_BUILD_SCRIPT" ]; then
            echo "Found build script: $TOOLCHAIN_BUILD_SCRIPT"
            (cd "$(dirname "$TOOLCHAIN_BUILD_SCRIPT")" && bash "$(basename "$TOOLCHAIN_BUILD_SCRIPT")")
          elif [ -f "$TOOLCHAIN_ROOT/Makefile" ]; then
            echo "Found Makefile; building OpenOrbis toolchain..."
            (cd "$TOOLCHAIN_ROOT" && make -j"$(nproc)")
          else
            echo "No supported OpenOrbis build script or Makefile found."
            echo "Repository contents:"
            find "$TOOLCHAIN_ROOT" -maxdepth 5 -type f | head -200 || true
            exit 1
          fi

          mapfile -t toolchain_dirs < <(
            find "$TOOLCHAIN_ROOT" -type f \( \
              -name 'orbis-clang++' -o \
              -name 'orbis-objcopy' -o \
              -name 'orbis-pub-gen' \
            \) -printf '%h\n' | sort -u
          )

          if [ "${#toolchain_dirs[@]}" -eq 0 ]; then
            echo "ERROR: No valid OpenOrbis toolchain binaries were produced."
            echo "Repository contents:"
            find "$TOOLCHAIN_ROOT" -maxdepth 5 -type f | head -200 || true
            exit 1
          fi

          echo "Found toolchain binary directories:"
          printf '%s\n' "${toolchain_dirs[@]}"

          for dir in "${toolchain_dirs[@]}"; do
            echo "$dir" >> "$GITHUB_PATH"
            export PATH="$dir:$PATH"
          done

          export PATH
          echo "PATH updated with:"
          printf '%s\n' "${toolchain_dirs[@]}"

          for bin in orbis-clang++ orbis-objcopy; do
            command -v "$bin" >/dev/null 2>&1 || {
              echo "$bin not found in PATH"
              exit 1
            }
          done

      - name: Build PS4 ELF and BIN
        shell: bash
        run: |
          set -euxo pipefail

          # Fix CRLF issues just in case
          sed -i 's/\r$//' Makefile || true
          sed -i 's/\r$//' main.cpp || true

          command -v orbis-clang++ >/dev/null 2>&1 || {
            echo "OpenOrbis clang not found; cannot build."
            exit 1
          }
          command -v orbis-objcopy >/dev/null 2>&1 || {
            echo "OpenOrbis objcopy not found; cannot build."
            exit 1
          }

          make clean || true
          make -j"$(nproc)"

      - name: Generate PS4 package if packaging tool is available
        shell: bash
        run: |
          set -euxo pipefail

          if ! command -v orbis-pub-gen >/dev/null 2>&1; then
            echo "orbis-pub-gen not found in PATH; skipping PKG generation."
            exit 0
          fi

          if [ -f "config.gp4" ]; then
            echo "Found config.gp4; generating PKG..."
            orbis-pub-gen config.gp4
          else
            echo "config.gp4 not found; skipping pkg generation."
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PS4-build-artifacts
          path: |
            ./*.bin
            ./*.elf
            ./*.pkg
