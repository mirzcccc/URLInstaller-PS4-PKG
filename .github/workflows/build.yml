name: Build PS4 Homebrew Binary

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake wget tar clang lld llvm make

      - name: Download and Install OpenOrbis Toolchain
        run: |
          # 1. Kreiranje direktorija za instalaciju
          sudo mkdir -p /opt/OpenOrbis
          
          # 2. Preuzimanje alata sa punim, eksplicitnim URL-om direktno u /opt direktorij
          sudo wget -O /opt/OpenOrbis/toolchain.tar.gz "https://github.com"
          
          # 3. Otpakivanje arhive unutar tog direktorija
          sudo tar -xzf /opt/OpenOrbis/toolchain.tar.gz -C /opt/OpenOrbis/
          
          # 4. Davanje dozvola za izvršavanje binarnih datoteka
          sudo chmod -R +x /opt/OpenOrbis/PS4Toolchain/bin/
          
          # 5. Postavljanje varijabli okruženja za rad u narednim koracima
          echo "OO_PS4_TOOLCHAIN=/opt/OpenOrbis/PS4Toolchain" >> $GITHUB_ENV
          echo "/opt/OpenOrbis/PS4Toolchain/bin" >> $GITHUB_PATH

      - name: Compile PS4 Source Code
        run: |
          # Osiguravanje da su putanje aktivne u trenutnoj ljusci
          export OO_PS4_TOOLCHAIN=/opt/OpenOrbis/PS4Toolchain
          export PATH=$OO_PS4_TOOLCHAIN/bin:$PATH
          
          # Automatsko čišćenje potencijalnih Windows simbola iz fajlova
          sed -i 's/\r$//' Makefile || true
          sed -i 's/\r$//' main.cpp || true
          
          # Pokretanje kompajliranja
          make

      - name: Upload Finished PS4 Binary
        uses: actions/upload-artifact@v4
        with:
          name: PS4-Executable-Binaries
          path: |
            ./*.bin
            ./*.elf
